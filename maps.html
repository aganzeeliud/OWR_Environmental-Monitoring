<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPATIAL HUB | OWR Monitoring Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; overflow: hidden; }
        #map { height: calc(100vh - 5rem); margin-top: 5rem; z-index: 1; }
        .sidebar {
            position: absolute;
            left: 2rem;
            top: 7rem;
            bottom: 2rem;
            width: 320px;
            z-index: 100;
            padding: 2rem;
            overflow-y: auto;
        }
        .layer-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .layer-control:hover { background: rgba(255,255,255,0.05); border-color: var(--accent-emerald); }
        .layer-control.active { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.05); }
        .layer-control input { display: none; }
        .layer-icon { width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; background: var(--bg-base); font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav class="glass-nav">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-map-location-dot"></i></div>
                <div class="logo-text">
                    <span class="logo-main">SPATIAL HUB</span>
                    <span class="logo-sub">GIS Command</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Analytics</a>
                <a href="climate-observatory.html" class="nav-link">Climate</a>
                <a href="fire-analysis.html" class="nav-link">Wildfire</a>
                <a href="mining-analysis.html" class="nav-link">Mining</a>
                <a href="logging-analysis.html" class="nav-link">Logging</a>
                <a href="maps.html" class="nav-link active">GIS Hub</a>
            </div>
            <a href="index.html" class="btn btn-outline btn-sm">Exit Console</a>
        </div>
    </nav>

    <div class="glass sidebar">
        <h2 class="font-heading" style="font-size: 1.25rem; margin-bottom: 2rem; text-transform: uppercase;">Spatial Engine</h2>
        
        <div style="margin-bottom: 3rem;">
            <span class="stat-label">Temporal Context</span>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <span class="mono">2001</span>
                <input type="range" min="2001" max="2030" value="2030" style="flex: 1; margin: 0 1rem;">
                <span class="mono">2030</span>
            </div>
        </div>

        <div style="margin-bottom: 2rem;">
            <span class="stat-label">Extraction Layers</span>
            <div class="layer-control active">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="layer-icon text-amber"><i class="fas fa-gem"></i></div>
                    <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Mining Titles</span>
                </div>
                <i class="fas fa-eye"></i>
            </div>
            <div class="layer-control">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="layer-icon text-blue"><i class="fas fa-road"></i></div>
                    <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Logging Roads</span>
                </div>
                <i class="fas fa-eye-slash"></i>
            </div>
        </div>

        <div style="margin-bottom: 2rem;">
            <span class="stat-label">Environmental Layers</span>
            <div class="layer-control active">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="layer-icon text-rose"><i class="fas fa-fire"></i></div>
                    <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Fire Hotspots</span>
                </div>
                <i class="fas fa-eye"></i>
            </div>
            <div class="layer-control">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="layer-icon text-emerald"><i class="fas fa-cloud-rain"></i></div>
                    <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Flood Risk</span>
                </div>
                <i class="fas fa-eye-slash"></i>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map = L.map('map', { zoomControl: false }).setView([1.75, 28.6], 8);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Fetch OWR Boundary
        fetch('data/boundary/okapi-boundary.geojson')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, { style: { color: '#10b981', weight: 2, fillOpacity: 0.02, dashArray: '5, 10' } }).addTo(map);
                map.fitBounds(L.geoJSON(data).getBounds());
            });

        // Layer Toggling logic (simulated for now)
        document.querySelectorAll('.layer-control').forEach(ctrl => {
            ctrl.addEventListener('click', () => {
                ctrl.classList.toggle('active');
                const icon = ctrl.querySelector('.fa-eye, .fa-eye-slash');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        });
    </script>
</body>
</html>
