<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Spatial Explorer | OWR Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>#map { height: calc(100vh - 64px); }</style>
</head>
<body class="bg-slate-50 overflow-hidden">
    <nav class="bg-emerald-900 text-white shadow-lg h-16 flex items-center px-6 justify-between">
        <a href="index.html" class="flex items-center space-x-2">
            <i class="fas fa-leaf text-emerald-400"></i>
            <span class="font-bold">OWR Spatial Intelligence</span>
        </a>
        <div class="space-x-4">
            <a href="dashboard.html" class="text-sm bg-emerald-800 hover:bg-emerald-700 px-4 py-2 rounded-lg transition">Back to Dashboard</a>
        </div>
    </nav>

    <div class="flex">
        <aside class="w-80 bg-white shadow-xl z-10 p-6 overflow-y-auto hidden lg:block" style="height: calc(100vh - 64px);">
            <h2 class="font-bold text-lg mb-6">Map Layers</h2>
            
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Base Layers</h3>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="base" id="baseSatellite" class="text-emerald-600" checked>
                            <span class="text-sm text-slate-700">Satellite Imagery (Sentinel-2)</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="base" id="baseOsm" class="text-emerald-600">
                            <span class="text-sm text-slate-700">Topographic (OSM)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Threat Monitoring</h3>
                    <div class="mb-4">
                        <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Filter Year:</label>
                        <select id="yearFilter" class="w-full bg-slate-100 border-none rounded-lg px-4 py-2 text-xs font-bold focus:ring-2 focus:ring-emerald-500">
                            <option value="all">Display All</option>
                        </select>
                    </div>
                    <div class="space-y-3">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm text-slate-700"><i class="fas fa-circle text-emerald-700 mr-2 text-xs"></i> CAMI Concessions</span>
                            <input type="checkbox" id="checkCami" checked class="rounded text-emerald-600">
                        </label>
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm text-slate-700"><i class="fas fa-circle text-amber-500 mr-2 text-xs"></i> IPIS Artisanal Sites</span>
                            <input type="checkbox" id="checkIpis" checked class="rounded text-emerald-600">
                        </label>
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm text-slate-700"><i class="fas fa-circle text-red-500 mr-2 text-xs"></i> Fire Hotspots</span>
                            <input type="checkbox" id="checkFire" checked class="rounded text-emerald-600">
                        </label>
                    </div>
                </div>

                <div class="pt-6 border-t">
                    <h3 class="font-bold mb-4 text-sm uppercase tracking-widest text-slate-400">Legend</h3>
                    <div class="space-y-2 text-xs font-bold">
                        <div class="flex items-center"><span class="w-3 h-3 bg-emerald-900 rounded-full mr-2"></span> OWR Boundary</div>
                        <div class="flex items-center"><span class="w-3 h-3 bg-emerald-600 mr-2"></span> Industrial (CAMI)</div>
                        <div class="flex items-center"><span class="w-3 h-3 bg-amber-400 mr-2"></span> Artisanal (IPIS)</div>
                        <div class="flex items-center"><span class="w-3 h-3 bg-red-400 opacity-50 mr-2"></span> Fire Damage</div>
                    </div>
                </div>
            </div>
        </aside>

        <div id="map" class="flex-grow"></div>
    </div>

    <script>
        const map = L.map('map').setView([1.6333, 28.5833], 9);

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: CAMI / IPIS'
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

        // OWR Boundary
        L.polygon([[1.0, 27.5], [1.0, 30.0], [2.5, 30.0], [2.5, 27.5]], {
            color: "#064e3b", weight: 4, fillOpacity: 0.05, dashArray: '10, 10'
        }).addTo(map).bindPopup("Okapi Wildlife Reserve Boundary");

        let miningLayer;
        let fireLayer = L.layerGroup().addTo(map);
        let geojsonData;

        async function loadSpatialData() {
            // Load Mining Titles (CAMI/IPIS)
            const res = await fetch('data/geojson/owr_mining_titles.json');
            geojsonData = await res.json();

            // Populate Year Filter
            const years = [...new Set(geojsonData.features.map(f => f.properties.year))].sort().reverse();
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                document.getElementById('yearFilter').appendChild(opt);
            });

            renderMiningLayer('all');

            // Fire Hotspots (Simulated)
            const firePoints = [[1.8, 28.2], [1.4, 29.1], [1.6, 28.8], [2.1, 27.9]];
            firePoints.forEach(p => {
                L.circleMarker(p, { radius: 10, fillColor: "#ef4444", color: "white", weight: 1, fillOpacity: 0.6 })
                 .addTo(fireLayer).bindPopup("NASA FIRMS: Thermal Anomaly");
            });
        }

        function renderMiningLayer(year) {
            if(miningLayer) map.removeLayer(miningLayer);
            
            miningLayer = L.geoJSON(geojsonData, {
                filter: (f) => year === 'all' || f.properties.year == year,
                style: (feature) => ({
                    color: feature.properties.type === 'Industrial' ? '#059669' : '#d97706',
                    weight: 3,
                    fillOpacity: 0.4
                }),
                pointToLayer: (feature, latlng) => {
                    return L.circleMarker(latlng, {
                        radius: 7, fillColor: '#d97706', color: "#fff", weight: 1, fillOpacity: 0.8
                    });
                },
                onEachFeature: (feature, layer) => {
                    layer.bindPopup(`<b>${feature.properties.id}</b><br>Year: ${feature.properties.year}<br>Source: ${feature.properties.source}<br>Operator: ${feature.properties.operator}`);
                }
            }).addTo(map);

            if(year !== 'all') {
                const bounds = miningLayer.getBounds();
                if(bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // Controls
        document.getElementById('baseSatellite').onchange = () => { map.addLayer(satellite); map.removeLayer(osm); };
        document.getElementById('baseOsm').onchange = () => { map.addLayer(osm); map.removeLayer(satellite); };
        document.getElementById('checkCami').onchange = (e) => { if(e.target.checked) map.addLayer(miningLayer); else map.removeLayer(miningLayer); };
        document.getElementById('checkFire').onchange = (e) => { if(e.target.checked) map.addLayer(fireLayer); else map.removeLayer(fireLayer); };
        document.getElementById('yearFilter').onchange = (e) => renderMiningLayer(e.target.value);

        loadSpatialData();
    </script>
</body>
</html>
