<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Timeline Explorer | OWR Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 0, 0, 0.05); }
        #timelineMap { height: 550px; width: 100%; border-radius: 3rem; background: #e2e8f0; border: 4px solid white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .timeline-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            outline: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #10b981;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .playing-glow { animation: pulsar 1.5s infinite; background: #10b981 !important; color: white !important; }
        @keyframes pulsar {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .chart-source { position: absolute; bottom: 0; right: 0; font-size: 8px; font-weight: 800; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; background: rgba(255,255,255,0.8); padding: 2px 8px; border-top-left-radius: 8px; }
    </style>
</head>
<body class="bg-[#f8fafc]">

    <nav class="bg-white text-slate-900 shadow-md h-16 flex items-center px-6 justify-between border-b border-slate-200 sticky top-0 z-[1000]">
...
        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 mb-16">
            <div class="lg:col-span-8 bg-white p-4 rounded-[4rem] border border-slate-200 shadow-lg">
                <div id="timelineMap"></div>
            </div>
            <div class="lg:col-span-4 space-y-8">
                <div class="bg-white p-10 rounded-[3rem] border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-black mb-8 uppercase tracking-widest text-slate-400">Cumulative Loss (ha)</h3>
                    <div class="relative h-[250px]">
                        <canvas id="cumulativeChart"></canvas>
                        <span class="chart-source">Source: Hansen GFC / UMD</span>
                    </div>
                </div>
                <div class="bg-white p-10 rounded-[3rem] border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-black mb-8 uppercase tracking-widest text-slate-400">Mining Expansion</h3>
                    <div class="relative h-[250px]">
                        <canvas id="miningExpansionChart"></canvas>
                        <span class="chart-source">Source: CAMI / IPIS</span>
                    </div>
                </div>
                <div class="bg-rose-50 p-10 rounded-[3rem] border border-rose-100 relative overflow-hidden">
...
</html>
