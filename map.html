<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Explorer | OWR Fire Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-heat@0.2.0/dist/leaflet-heat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        #map { height: calc(100vh - 64px); background: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.05); }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; }
        .timeline-control { background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body class="overflow-hidden text-slate-700">
    <nav class="bg-white text-slate-900 shadow-md h-16 flex items-center px-6 justify-between border-b border-slate-200 relative z-[1001]">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="bg-rose-600 p-2 rounded-lg">
                <i class="fas fa-satellite text-white"></i>
            </div>
            <span class="font-bold tracking-tighter text-xl uppercase">OWR SPATIAL INTEL</span>
        </a>
        <div class="flex items-center space-x-6">
            <a href="index.html" class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-rose-600 transition">Dashboard</a>
            <div class="bg-emerald-50 rounded-full px-4 py-1 text-[10px] font-black uppercase tracking-widest text-emerald-600 items-center border border-emerald-100 flex">
                <span class="w-2 h-2 bg-emerald-500 rounded-full mr-2 animate-pulse"></span> Classified Dataset
            </div>
        </div>
    </nav>

    <div class="flex relative">
        <!-- Sidebar -->
        <aside class="w-80 glass z-[1000] p-6 overflow-y-auto absolute left-0 top-0 bottom-0 m-4 rounded-3xl shadow-xl transition-transform duration-300" id="sidebar">
            <h2 class="font-black text-xs uppercase tracking-[0.2em] text-rose-600 mb-6">Advanced Filter</h2>
            
            <div class="space-y-8">
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Temporal Filter</h3>
                    <input type="range" id="timeSlider" min="2001" max="2026" value="2026" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-rose-600">
                    <div class="flex justify-between mt-2 text-[10px] font-bold text-slate-400">
                        <span>2001</span>
                        <span id="currentYear" class="text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">2026</span>
                        <span>2026</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Fire Type</h3>
                    <select id="typeFilter" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold text-slate-700 outline-none">
                        <option value="all">All drivers</option>
                        <option value="Agricultural fire">Agriculture</option>
                        <option value="Slash-and-burn agriculture">Slash-and-Burn</option>
                        <option value="Charcoal production">Charcoal</option>
                        <option value="Wildfire/natural vegetation fire">Wildfire</option>
                        <option value="Mining-related fire">Mining</option>
                        <option value="Settlement-related fire">Settlement</option>
                        <option value="Hunting/fire camp">Hunting Camp</option>
                    </select>
                </div>

                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Severity</h3>
                    <div class="flex gap-2">
                        <button onclick="toggleSev('Low')" class="sev-btn bg-emerald-50 text-emerald-600 px-3 py-1 rounded-lg text-[10px] font-black border border-emerald-100 opacity-50" data-val="Low">LOW</button>
                        <button onclick="toggleSev('Moderate')" class="sev-btn bg-amber-50 text-amber-600 px-3 py-1 rounded-lg text-[10px] font-black border border-amber-100 opacity-50" data-val="Moderate">MOD</button>
                        <button onclick="toggleSev('High')" class="sev-btn bg-orange-50 text-orange-600 px-3 py-1 rounded-lg text-[10px] font-black border border-orange-100 opacity-50" data-val="High">HIGH</button>
                        <button onclick="toggleSev('Extreme')" class="sev-btn bg-rose-50 text-rose-600 px-3 py-1 rounded-lg text-[10px] font-black border border-rose-100 opacity-100" data-val="Extreme">EXT</button>
                    </div>
                </div>

                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Layers</h3>
                    <div class="space-y-3">
                        <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100 cursor-pointer transition border border-slate-200">
                            <span class="text-xs font-bold"><i class="fas fa-fire text-rose-600 mr-2"></i> Hotspots</span>
                            <input type="checkbox" id="checkHotspots" checked class="rounded-full text-rose-600 focus:ring-0">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100 cursor-pointer transition border border-slate-200">
                            <span class="text-xs font-bold"><i class="fas fa-layer-group text-amber-600 mr-2"></i> Risk Heatmap</span>
                            <input type="checkbox" id="checkHeatmap" class="rounded-full text-amber-600 focus:ring-0">
                        </label>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100">
                    <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                        <h4 class="text-[10px] font-black text-rose-600 uppercase tracking-widest mb-1">Filter Result</h4>
                        <div class="text-2xl font-black text-slate-900" id="statCount">0</div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Events matched</p>
                    </div>
                </div>
            </div>
        </aside>

        <div id="map" class="w-full"></div>
        
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[1001] timeline-control no-print">
            <button id="playBtn" class="text-rose-600 hover:scale-110 transition"><i class="fas fa-play"></i></button>
            <span class="text-xs font-black uppercase tracking-widest text-slate-400">Temporal Indexing</span>
        </div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([1.6333, 28.5833], 9);
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',{ maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'], attribution: 'Google Maps' }).addTo(map);

        let hotspotLayer = L.markerClusterGroup();
        let heatmapLayer = L.heatLayer([], { radius: 25, blur: 15, maxZoom: 10 });
        let allHotspots = [];
        let activeSeverities = ["Low", "Moderate", "High", "Extreme"];

        async function initMap() {
            const [bndRes, fireRes] = await Promise.all([
                fetch('data/boundary/okapi-boundary.geojson'),
                fetch('data/geojson/fire-classification.geojson')
            ]);

            const boundaryData = await bndRes.json();
            const fireData = await fireRes.json();
            allHotspots = fireData.features;

            L.geoJSON(boundaryData, {
                style: { color: "#10b981", weight: 3, fillOpacity: 0.05, dashArray: '5, 10' }
            }).addTo(map);

            render();
        }

        function render() {
            const year = document.getElementById('timeSlider').value;
            const type = document.getElementById('typeFilter').value;
            
            hotspotLayer.clearLayers();
            const filtered = allHotspots.filter(f => {
                const p = f.properties;
                return p.year == year && 
                       (type == 'all' || p.fire_type == type) &&
                       activeSeverities.includes(p.severity);
            });
            
            filtered.forEach(f => {
                const p = f.properties;
                const marker = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
                    radius: 7, fillColor: getSevColor(p.severity), color: '#fff', weight: 1, fillOpacity: 0.9
                }).bindPopup(`
                    <div class="p-2">
                        <div class="text-[10px] font-black text-slate-400 uppercase mb-1">${p.severity} SEVERITY</div>
                        <div class="text-sm font-black text-slate-900">${p.fire_type}</div>
                        <div class="grid grid-cols-2 gap-4 mt-4 text-[10px] font-bold">
                            <div><span class="text-slate-400 block uppercase">Burned</span> ${p.burned_area_ha} ha</div>
                            <div><span class="text-slate-400 block uppercase">Loss</span> ${p.forest_loss_ha} ha</div>
                            <div><span class="text-slate-400 block uppercase">FRP</span> ${p.frp} MW</div>
                            <div><span class="text-slate-400 block uppercase">CONF</span> ${p.confidence}%</div>
                        </div>
                    </div>
                `);
                hotspotLayer.addLayer(marker);
            });

            if(document.getElementById('checkHotspots').checked) hotspotLayer.addTo(map);
            heatmapLayer.setLatLngs(filtered.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0], 0.5]));
            if(document.getElementById('checkHeatmap').checked) heatmapLayer.addTo(map);
            
            document.getElementById('statCount').innerText = filtered.length.toLocaleString();
        }

        function getSevColor(s) {
            return s == "Extreme" ? "#e11d48" : (s == "High" ? "#f59e0b" : (s == "Moderate" ? "#fcd34d" : "#10b981"));
        }

        function toggleSev(val) {
            const btn = document.querySelector(`.sev-btn[data-val="${val}"]`);
            if(activeSeverities.includes(val)) {
                activeSeverities = activeSeverities.filter(v => v !== val);
                btn.style.opacity = "0.5";
            } else {
                activeSeverities.push(val);
                btn.style.opacity = "1";
            }
            render();
        }

        document.getElementById('timeSlider').oninput = (e) => {
            document.getElementById('currentYear').innerText = e.target.value;
            render();
        };
        document.getElementById('typeFilter').onchange = render;
        document.getElementById('checkHotspots').onchange = (e) => e.target.checked ? hotspotLayer.addTo(map) : map.removeLayer(hotspotLayer);
        document.getElementById('checkHeatmap').onchange = (e) => e.target.checked ? heatmapLayer.addTo(map) : map.removeLayer(heatmapLayer);

        initMap();
    </script>
</body>
</html>
